/* Ambil link gambar otomatis dari teks / kode HTML / BBCode / link imgbb */
function extractImages(text) {
  text = String(text || '').replace(/&amp;/g, '&');
  const found = []; let m;
  const attr = /(?:src|data-src)\s*=\s*["']([^"']+)["']/gi;
  while ((m = attr.exec(text))) found.push(m[1]);
  const href = /href\s*=\s*["']([^"']+)["']/gi;
  while ((m = href.exec(text))) found.push(m[1]);
  const bare = /https?:\/\/[^\s"'<>\[\]()]+/gi;
  while ((m = bare.exec(text))) found.push(m[0]);
  const direct = u => /^https?:\/\/i\.ibb\.co(\.com)?\//i.test(u) || /\.(png|jpe?g|gif|webp|avif|bmp|svg)(\?[^\s]*)?$/i.test(u);
  const out = [];
  for (let u of found) {
    u = u.trim().replace(/^http:\/\//i, 'https://');
    if (direct(u) && !out.includes(u)) out.push(u);
  }
  return out;
}

const ipValues = ip => { const out = []; $$('.ip-row input', ip).forEach(i => extractImages(i.value).forEach(u => { if (!out.includes(u)) out.push(u); })); return out.slice(0, +ip.dataset.max); };

async function googleLogin() {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) {
    console.error(e);
    if (e.code === 'auth/popup-blocked') { try { await signInWithRedirect(auth, new GoogleAuthProvider()); } catch (x) {} }
    else if (e.code === 'auth/unauthorized-domain') toast('Domain website belum didaftarkan di Firebase Authentication (Authorized domains).');
    else if (e.code === 'auth/operation-not-allowed') toast('Login Google belum diaktifkan di Firebase Authentication.');
    else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') toast('Login Google gagal. Coba lagi.');
  }
}

function route() {

  if (page !== 'toko' && S.unsubStore) { S.unsubStore(); S.unsubStore = null; S.storeUid = null; }
  window.scrollTo(0, 0); closeModal();
  $$('nav a[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === page));
  document.title = (S.settings.storeName || 'BeliDulu') + (page === '' ? ' - Toko Online Praktis Tanpa Akun' : '');
  if (page === 'produk') viewProduct(arg);
  else if (page === 'toko') viewStorefront(arg);
  else if (page === 'beli') viewCheckout(arg);
  else if (page === 'pesanan') viewOrders();
  else if (page === 'favorit') viewWish();
  else if (page === 'keranjang') viewCart();
  else if (page === 'jual') viewSeller();
  else if (page === 'tentang') viewAbout();
  else if (page === 'admin') viewAdmin();
  else viewHome();
}

function editDistance(a,b){a=a.slice(0,80);b=b.slice(0,80);const row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const old=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old;}}return row[b.length];}

function currentQty() { const p = S.cur; let q = Math.max(1, parseInt($('#qty').value) || 1); if (typeof p.stock === 'number') q = Math.min(q, p.stock); return q; }
function effectivePrice(p) { return p?.discountPrice && p.discountPrice < p.price ? p.discountPrice : (p?.price || 0); }
function couponFor(code, subtotal) { const wanted=(S.settings.couponCode||'').trim().toUpperCase(); return wanted && String(code||'').trim().toUpperCase()===wanted ? Math.round(subtotal*(Number(S.settings.couponPercent)||10)/100) : 0; }
function syncQty() { const q = currentQty(); $('#qty').value = q; const base=effectivePrice(S.cur)*q; const ci=$('#coupon'); const off=ci ? couponFor(ci.value,base) : 0; $('#sumTotal').textContent = rupiah(Math.max(0,base-off)); }
const makeCode = () => { const d = new Date(); const pad = n => String(n).padStart(2, '0'); const r = Math.random().toString(36).slice(2, 6).toUpperCase(); return `BD-${String(d.getFullYear()).slice(2)}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${r}`; };

async function changeStatus(o, newStatus, { note = '', resi = null, by = 'admin' } = {}) {
  const upd = { status: newStatus, updatedAt: Date.now() };
  if (resi !== null) upd.resi = resi;
  if (newStatus !== o.status || note) upd.history = arrayUnion({ status: newStatus, note, at: Date.now(), by });
  await updateDoc(doc(db, 'orders', o.code), upd);
  const wasC = o.status === 'Dibatalkan', isC = newStatus === 'Dibatalkan';
  if (wasC !== isC) {
    for (const it of o.items || []) {
      try {
        const ref = doc(db, 'products', it.productId); const s = await getDoc(ref);
        if (s.exists() && typeof s.data().stock === 'number') await updateDoc(ref, { stock: increment(isC ? it.qty : -it.qty) });
      } catch (e) {}
    }
  }
}

async function saveProduct(form) {
  const f = new FormData(form); const v = k => (f.get(k) || '').toString().trim(); const ctx = v('ctx');

  const ip = $('.ip', form); if (ipInvalid(ip)) return toast('Ada link foto yang tidak dikenali. Gunakan Direct link atau kode HTML dari imgbb.');
  const stockRaw = v('stock');
  const discountRaw = v('discountPrice'); const discountPrice = discountRaw === '' ? null : Math.max(0, parseInt(discountRaw)||0);
  if (discountPrice !== null && discountPrice >= price) return toast('Harga diskon harus lebih rendah dari harga normal.');
  const variants = {};
  for (const [key,label] of [['color','Warna'],['size','Ukuran'],['model','Model'],['custom','Lainnya']]) {
    const enabled = f.get('variant_'+key+'_enabled') === 'on';
    const options = (f.get('variant_'+key+'_options') || '').toString().split(/[\n,]+/).map(x=>x.trim()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).slice(0,50);
    if (enabled && !options.length) return toast('Isi minimal satu pilihan untuk variasi '+label+'.');
    variants[key] = { enabled, options: enabled ? options : [] };
  }
  const data = { name: v('name'), price, discountPrice, preorder: f.get('preorder') === 'on', category: v('category'), description: (f.get('description') || '').toString().trim(), images: ipValues(ip), variants,
    stock: stockRaw === '' ? null : Math.max(0, parseInt(stockRaw) || 0), active: f.get('active') === 'on', updatedAt: Date.now() };
  try {
    if (v('id')) {
      if (ctx === 'seller') { if (S.profile?.accountDisabled || !packageIsActive(S.profile)) return toast('Akun atau paket penjual sedang tidak aktif.'); const cur = S.products.find(x => x.id === v('id')); if (!cur || cur.sellerId !== S.user?.uid) return toast('Anda hanya dapat mengubah produk milik sendiri.'); }
      await updateDoc(doc(db, 'products', v('id')), data);
    } else {
      const extra = { createdAt: Date.now(), ratingSum: 0, ratingCount: 0 };

        if (!S.user || !S.profile?.isSeller || S.profile?.accountDisabled) return toast(S.profile?.accountDisabled ? 'Akun penjual dinonaktifkan oleh pengelola.' : 'Aktifkan paket penjual terlebih dahulu.');
        if (!packageIsActive(S.profile) || (S.profile.subscriptionExpiresAt && S.profile.subscriptionExpiresAt < Date.now())) return toast('Masa paket penjual tidak aktif. Perpanjang melalui Profil.');
        if (S.profile.planStatus === 'pending') return toast('Paket penjual menunggu verifikasi pembayaran melalui WhatsApp developer.');
        if (S.profile.planStatus === 'expired' || (S.profile.sellerPlan === 'trial' && S.profile.trialStartedAt && Date.now()-S.profile.trialStartedAt >= 7*86400000)) return toast('Masa Free Trial berakhir. Pilih paket berbayar melalui Profil.');
        Object.assign(extra, { sellerId: S.user.uid, sellerName: S.profile.storeName || S.profile.name || 'Penjual', approved: !S.settings.sellerApproval });

    }

  } catch (e) { console.error('saveProduct error:', e); toast('Gagal menyimpan produk' + (e?.code ? ' (' + e.code + ')' : '') + '. Periksa koneksi dan aturan Firestore.'); }
}

function formatCountdown(expiresAt) {
  const ms = Number(expiresAt || 0) - Date.now();
  if (!expiresAt || ms <= 0) return 'Masa paket telah berakhir';
  const total = Math.floor(ms / 1000), days = Math.floor(total / 86400), hours = Math.floor((total % 86400) / 3600), mins = Math.floor((total % 3600) / 60), secs = total % 60;
  return `${days} hari ${hours} jam ${mins} menit ${secs} detik`;
}
function packageIsActive(pr = S.profile) {
  if (!pr || pr.accountDisabled || !pr.isSeller) return false;
  if (!pr.subscriptionExpiresAt) return pr.planStatus === 'active';
  return Number(pr.subscriptionExpiresAt) > Date.now() && ['active','trial'].includes(pr.planStatus);
}
function packageNeedsRenewal(pr = S.profile) {
  const end = Number(pr?.subscriptionExpiresAt || 0);
  return !packageIsActive(pr) || end - Date.now() <= 7 * 86400000;
}
let countdownTicker = null;
function startCountdownTicker() {
  if (countdownTicker) clearInterval(countdownTicker);
  countdownTicker = setInterval(() => {
    const el = document.querySelector('[data-package-countdown]');
    if (el) el.textContent = formatCountdown(Number(el.dataset.packageCountdown));
    document.querySelectorAll('[data-admin-countdown]').forEach(n => n.textContent = formatCountdown(Number(n.dataset.adminCountdown)));
  }, 1000);
}
startCountdownTicker();

async function copyStoreUrl(uid) {
  if (!uid) return;
  const url = location.origin + '/toko/' + encodeURIComponent(uid);
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(url); toast('URL profil toko disalin.'); }
    else { const t=document.createElement('textarea'); t.value=url; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); const ok=document.execCommand('copy'); t.remove(); if(ok) toast('URL profil toko disalin.'); else prompt('Salin URL profil toko:',url); }
  } catch(e) { prompt('Salin URL profil toko:',url); }
}
function shareStore(uid) {
  const url = location.origin + '/toko/' + encodeURIComponent(uid);
  const seller = S.users[uid] || {};
  const title = seller.storeName || seller.name || 'Toko BeliDulu';
  if (navigator.share) navigator.share({title, text:'Lihat toko '+title+' di BeliDulu', url}).catch(()=>{});
  else copyStoreUrl(uid);
}
async function toggleFollow(uid) {
  if (!S.user) return googleLogin();
  if (!uid || uid === S.user.uid || S.followBusy) return;
  S.followBusy = true;
  try {
    const ref = doc(db,'users',uid), snap = await getDoc(ref);
    if (!snap.exists()) { toast('Profil toko tidak ditemukan.'); return; }
    const data = snap.data(), followers = Array.isArray(data.followers) ? data.followers : [];
    const next = followers.includes(S.user.uid) ? followers.filter(id=>id!==S.user.uid) : [...followers,S.user.uid];
    await updateDoc(ref,{followers:next, followersCount:next.length, updatedAt:Date.now()});
    S.users[uid] = {...data,followers:next,followersCount:next.length};
    viewStorefront(uid);
    toast(next.includes(S.user.uid) ? 'Berhasil follow toko.' : 'Berhasil unfollow toko.');
  } catch(err) { console.error(err); toast('Gagal memperbarui follow. Periksa aturan Firestore.'); }
  finally { S.followBusy = false; }
}

Nama toko: ${S.profile.storeName || S.profile.name || '-'}
Email: ${S.user.email || '-'}
UID: ${S.user.uid}
Permintaan: ${plan === (S.profile.sellerPlan || '') ? 'perpanjangan' : 'ganti paket'}`;
    window.open(waLink(S.settings.developerWhatsApp || '082254388144', msg), '_blank', 'noopener');
    viewSeller();

async function saveProfile(form) {
  const f = new FormData(form); const v = k => (f.get(k) || '').toString().trim();
  const ip = $('.ip[data-ip="photo"]', form); const logoIp = $('.ip[data-ip="storeLogo"]', form); if (ipInvalid(ip) || (logoIp && ipInvalid(logoIp))) return toast('Link gambar tidak dikenali. Gunakan Direct link atau kode HTML dari imgbb.');
  const isSeller = S.profile?.accountDisabled ? false : (f.get('isSeller') === 'on');
  const wa = normPhone(v('wa'));
  if (isSeller) {
    if (!v('storeName')) return toast('Nama toko wajib diisi.');
    if (wa.length < 10 || wa.length > 15) return toast('Nomor WhatsApp penjual tidak valid.');
  }
  const plan = (f.get('sellerPlan') || S.profile?.sellerPlan || 'trial').toString();
  const planMeta = {trial:{label:'Free Trial 7 hari',price:0,days:7},weekly:{label:'Mingguan',price:10000,days:7},monthly:{label:'Bulanan',price:50000,days:30},yearly:{label:'Tahunan',price:400000,days:365}}[plan] || {label:'Free Trial 7 hari',price:0,days:7};
  const was = !!S.profile?.isSeller;
  const trialStartedAt = plan === 'trial' ? (S.profile?.trialStartedAt || Date.now()) : (S.profile?.trialStartedAt || null);
  const trialActive = plan === 'trial' && Date.now() - trialStartedAt < 7 * 86400000;
  const paidAlreadyActive = S.profile?.sellerPlan === plan && S.profile?.planStatus === 'active' && (!S.profile?.subscriptionExpiresAt || S.profile.subscriptionExpiresAt > Date.now()) && !packageNeedsRenewal(S.profile);
  const activeUnchanged = packageIsActive(S.profile) && plan === (S.profile?.sellerPlan || 'trial') && !packageNeedsRenewal(S.profile);
  const planStatus = activeUnchanged ? (S.profile?.planStatus || 'active') : (plan === 'trial' ? (trialActive ? 'trial' : 'expired') : (paidAlreadyActive ? 'active' : 'pending'));
  const sellerActive = !S.profile?.accountDisabled && isSeller && (activeUnchanged || trialActive || paidAlreadyActive || (was && !S.profile?.sellerPlan));
  const data = { email: S.user.email || '', name: v('name'), photo: ipValues(ip)[0] || '', isSeller: sellerActive, storeName: v('storeName'), storeLogo: logoIp ? (ipValues(logoIp)[0] || S.profile?.storeLogo || '') : (S.profile?.storeLogo || ''), wa: isSeller ? wa : (S.profile?.wa || ''), bio: v('bio'), sellerPlan: plan, sellerPlanLabel: planMeta.label, sellerPlanPrice: planMeta.price, sellerPlanDays: planMeta.days, trialStartedAt, trialUsed: !!(S.profile?.trialUsed || plan === 'trial'), subscriptionExpiresAt: activeUnchanged ? S.profile.subscriptionExpiresAt : (plan === 'trial' ? trialStartedAt + 7*86400000 : (paidAlreadyActive ? (S.profile?.subscriptionExpiresAt || null) : null)), accountDisabled: !!S.profile?.accountDisabled, planStatus, updatedAt: Date.now() };
  try {
    await setDoc(doc(db, 'users', S.user.uid), data, { merge: true });
    S.profile = { ...(S.profile || {}), ...data }; delete S.users[S.user.uid];
    if (sellerActive && !was) S.stab = 'products';
    renderAccount();
    if (isSeller && plan !== 'trial' && !paidAlreadyActive) {
      toast('Profil disimpan. Lanjutkan permintaan paket melalui WhatsApp.');
      viewSeller();
      const message = `Halo developer BeliDulu, saya ingin mengaktifkan paket penjual ${planMeta.label} seharga ${rupiah(planMeta.price)}.\nNama toko: ${data.storeName}\nEmail akun: ${S.user.email || '-'}\nUID: ${S.user.uid}`;
      window.open(waLink(S.settings.developerWhatsApp || '082254388144', message), '_blank', 'noopener');
    } else {
      toast(isSeller && plan === 'trial' && !trialActive ? 'Free Trial sudah berakhir. Pilih paket berbayar.' : (plan === 'trial' && !was ? 'Free Trial aktif selama 7 hari.' : 'Profil disimpan.'));
      viewSeller();
    }
    if (sellerActive) S.products.filter(p => p.sellerId === S.user.uid && p.sellerName !== data.storeName).forEach(p => updateDoc(doc(db, 'products', p.id), { sellerName: data.storeName }).catch(() => {}));
  } catch (e) { console.error(e); toast('Gagal menyimpan profil.'); }
}

function exportCSV(rows, filename) {
  const quote = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = rows.map(r => r.map(quote).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8;'}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);
}

document.addEventListener('click', async e => {

  else if (act === 'mobile-nav') { const nav=$('#mainNav'); const open=nav.classList.toggle('mobile-open'); el.setAttribute('aria-expanded', String(open)); el.textContent=open ? '✕ Tutup' : '☰ Menu'; }
  else if (act === 'seller-disable') { const uid=el.dataset.id; if(!confirm('Nonaktifkan akun penjual ini? Akun tidak dapat menambahkan atau menjual produk.')) return; try { await updateDoc(doc(db,'users',uid),{accountDisabled:true,isSeller:false,planStatus:'disabled',updatedAt:Date.now()}); const ps=await getDocs(query(collection(db,'products'),where('sellerId','==',uid))); await Promise.all(ps.docs.map(d=>updateDoc(d.ref,{active:false,approved:false,disabledByAdmin:true,updatedAt:Date.now()}))); if(S.user?.uid===uid){S.profile={...(S.profile||{}),accountDisabled:true,isSeller:false,planStatus:'disabled'}; viewSeller();} toast('Akun penjual dinonaktifkan.'); renderAdminSellers(); } catch(err) { console.error(err); toast('Gagal menonaktifkan akun. Periksa aturan Firestore.'); } }

  else if (act === 'copy-store-name') { const name=S.profile?.storeName || S.profile?.name || S.user?.displayName || ''; if(!name) return toast('Nama akun belum tersedia.'); try { await navigator.clipboard.writeText(name); toast('Nama akun disalin.'); } catch(e) { prompt('Salin nama akun:',name); } }
  else if (act === 'copy-store-url') copyStoreUrl(el.dataset.id);
  else if (act === 'share-store') shareStore(el.dataset.id);
  else if (act === 'toggle-follow') toggleFollow(el.dataset.id);

  else if (act === 'report-product') reportProduct(el.dataset.id);
  else if (act === 'report-seller') reportSeller(el.dataset.id);
  else if (act === 'stock-alert') subscribeStock(el.dataset.id);
  else if (act === 'export-orders') exportCSV([['Kode','Tanggal','Status','Pembeli','Telepon','Produk','Subtotal','Provinsi','Kota','Alamat'], ...S.orders.map(o => [o.code,fmtDate(o.createdAt),o.status,o.customer?.name,o.customer?.phone,(o.items||[]).map(i=>`${i.name} x${i.qty}`).join('; '),o.subtotal,o.customer?.provinsi,o.customer?.kota,fmtAddress(o.customer||{})])], 'belidulu-pesanan.csv');
  else if (act === 'print-orders') window.print();
  else if (act === 'print-invoice') printInvoice(code);
  else if (act === 'notify-status') notifyOrderStatus(code);
  else if (act === 'backup-data') { const data = {exportedAt:new Date().toISOString(), products:S.products, orders:S.orders, settings:S.settings}; const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='belidulu-backup.json'; a.click(); URL.revokeObjectURL(url); }
  else if (act === 'add-cart') { addCart(el.dataset.id); renderCartCount(); }
  else if (act === 'cart-remove') { saveCart(getCart().filter(x=>x.id!==el.dataset.id)); viewCart(); renderCartCount(); }

  else if (act === 'cat') { S.cat = el.dataset.v; renderGrid(); }
  else if (act === 'wish') { e.preventDefault(); toggleWish(el.dataset.id); }
  else if (act === 'thumb') { const m = $('.gal .main img'); m.src = el.dataset.src; $$('.thumbs button').forEach(b => b.classList.toggle('on', b === el)); }
  else if (act === 'rate') { const n = +el.dataset.v; $$('#rIn button').forEach((b, i) => $('.star', b).classList.toggle('on', i < n)); $('input[name=rating]').value = n; }
  else if (act === 'qty') { const i = $('#qty'); i.value = Math.max(1, (parseInt(i.value) || 1) + (+el.dataset.d)); syncQty(); }

  else if (act === 'ip-del') { const ip = el.closest('.ip'); el.closest('.ip-row').remove(); if (!$$('.ip-row', ip).length) $('.ip-rows', ip).innerHTML = ipRow(''); updateIp(ip); }

  else if (act === 'gl-logout') { await signOut(auth); toast('Anda sudah keluar.'); }
  else if (act === 'stab') { S.stab = el.dataset.stab; $$('.tabs [data-stab]').forEach(b => b.classList.toggle('on', b.dataset.stab === S.stab)); renderSellerTab(); }

  else if (act === 'p-edit-s') productForm(S.products.find(p => p.id === el.dataset.id), 'seller');
  else if (act === 'refresh') { try { await loadMyOrder(code); renderMyList(); toast('Pesanan diperbarui.'); } catch (x) { toast('Gagal memperbarui.'); } }
  else if (act === 'refresh-all') { await Promise.all(getMyCodes().map(c => loadMyOrder(c).catch(() => null))); renderMyList(); toast('Semua pesanan diperbarui.'); }
  else if (act === 'cancel') {
    const o = S.my[code]; if (!o) return;
    const fresh = await loadMyOrder(code);

    if (!confirm('Batalkan pesanan ' + code + '?')) return;
    try { await changeStatus(fresh, 'Dibatalkan', { note: 'Dibatalkan oleh pembeli', by: 'pembeli' }); await loadMyOrder(code); renderMyList(); toast('Pesanan dibatalkan. Anda dapat memberi tahu penjual lewat tombol Hubungi.'); } catch (x) { toast('Gagal membatalkan pesanan.'); }
  }
  else if (act === 'arrived') {
    const o = S.my[code]; if (!o) return;
    try { await changeStatus(o, 'Sampai', { note: 'Pembeli mengonfirmasi pesanan sudah sampai', by: 'pembeli' }); await loadMyOrder(code); renderMyList(); toast('Terima kasih. Mohon kabari penjual lewat tombol Kabari.'); } catch (x) { toast('Gagal memperbarui status.'); }
  }
  else if (act === 'tab') { S.tab = el.dataset.tab; $$('.tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab)); renderAdminTab(); }
  else if (act === 'logout') { S.admin = false; sessionStorage.removeItem('bd_admin'); if (S.unsubOrders) { S.unsubOrders(); S.unsubOrders = null; } viewAdmin(); }
  else if (act === 'report-resolve') { try { await updateDoc(doc(db,'reports',el.dataset.id),{status:'ditangani',handledAt:Date.now()}); toast('Laporan ditandai sudah ditangani.'); renderAdminSellers(); } catch(e) { toast('Gagal memperbarui laporan. Periksa aturan Firestore.'); } }
  else if (act === 'seller-activate') { const uid=el.dataset.id; const days=Math.max(1,Math.min(366,parseInt(el.dataset.days)||7)); try { const snap=await getDoc(doc(db,'users',uid)); if(!snap.exists()) return toast('Akun penjual tidak ditemukan.'); const u=snap.data(); if(u.accountDisabled) return toast('Buka blokir akun terlebih dahulu.'); const requested=u.requestedPlan || u.sellerPlan || 'weekly'; const labels={trial:'Free Trial 7 hari',weekly:'Mingguan',monthly:'Bulanan',yearly:'Tahunan'}; const prices={trial:0,weekly:10000,monthly:50000,yearly:400000}; const now=Date.now(), oldEnd=Number(u.subscriptionExpiresAt||0), extendFrom=Math.max(now,oldEnd), planDays=Number(u.requestedPlanDays || u.sellerPlanDays)||({'weekly':7,'monthly':30,'yearly':365,'trial':7}[requested]||days), expires=extendFrom+planDays*86400000; if(requested==='trial' && (u.trialUsed || u.trialStartedAt)) return toast('Free Trial sudah pernah digunakan akun ini.'); await updateDoc(doc(db,'users',uid), {isSeller:true, accountDisabled:false, planStatus:requested==='trial'?'trial':'active', sellerPlan:requested, sellerPlanLabel:u.requestedPlanLabel || labels[requested], sellerPlanPrice:Number(u.requestedPlanPrice ?? prices[requested] ?? 0), sellerPlanDays:planDays, trialUsed:!!(u.trialUsed || requested==='trial'), trialStartedAt:requested==='trial'?(u.trialStartedAt || now):(u.trialStartedAt || null), subscriptionStartedAt:now, subscriptionExpiresAt:expires, requestedPlan:null, requestedPlanLabel:null, requestedPlanPrice:null, requestedPlanDays:null, planRequestedAt:null, updatedAt:now}); const ps=await getDocs(query(collection(db,'products'),where('sellerId','==',uid))); await Promise.all(ps.docs.filter(d=>d.data().disabledByExpiry===true && d.data().disabledByAdmin!==true).map(d=>updateDoc(d.ref,{active:true,disabledByExpiry:false,updatedAt:now}))); if(S.user?.uid===uid){S.profile={...u,isSeller:true,accountDisabled:false,planStatus:requested==='trial'?'trial':'active',sellerPlan:requested,sellerPlanLabel:u.requestedPlanLabel || labels[requested],sellerPlanDays:planDays,subscriptionStartedAt:now,subscriptionExpiresAt:expires,requestedPlan:null};} toast('Paket penjual berhasil diaktifkan / diperpanjang.'); renderAdminSellers(); } catch(e) { console.error(e); toast('Gagal mengaktifkan paket. Periksa aturan Firestore.'); } }
  else if (act === 'p-new') productForm(null, 'admin');
  else if (act === 'p-edit') productForm(S.products.find(p => p.id === el.dataset.id), 'admin');
  else if (act === 'p-del') deleteProduct(el.dataset.id);
  else if (act === 'p-approve') { try { await updateDoc(doc(db, 'products', el.dataset.id), { approved: true }); toast('Produk disetujui.'); } catch (x) { toast('Gagal menyetujui produk.'); } }
  else if (act === 'r-del') {
    if (!confirm('Hapus ulasan ini?')) return;
    try { await deleteDoc(doc(db, 'reviews', el.dataset.id)); try { await updateDoc(doc(db, 'products', el.dataset.pid), { ratingSum: increment(-(+el.dataset.rating)), ratingCount: increment(-1) }); } catch (x) {} toast('Ulasan dihapus.'); renderAdminReviews(); } catch (x) { toast('Gagal menghapus ulasan.'); }
  }
  else if (act === 'o-save') {
    const o = S.orders.find(x => x.code === code) || S.sellerOrders.find(x => x.code === code); const row = $(`[data-ord="${CSS.escape(code)}"]`); if (!o || !row) return;
    const status = $('[data-f=status]', row).value, resi = $('[data-f=resi]', row).value.trim(), note = $('[data-f=note]', row).value.trim();
    try { await changeStatus(o, status, { note, resi, by: currentPage() === 'admin' ? 'admin' : 'penjual' }); toast('Pesanan diperbarui.'); } catch (x) { toast('Gagal menyimpan.'); }
  }
  else if (act === 'o-del') { if (!confirm('Hapus pesanan ' + code + ' secara permanen?')) return; try { await deleteDoc(doc(db, 'orders', code)); S.openOrders.delete(code); toast('Pesanan dihapus.'); } catch (x) { toast('Gagal menghapus.'); } }
  else if (act === 'wa-add') { $('#waRows').insertAdjacentHTML('beforeend', waRow()); }
  else if (act === 'wa-del') { const rows = $$('.wa-row'); if (rows.length > 1) el.closest('.wa-row').remove(); else $$('input', el.closest('.wa-row')).forEach(i => i.value = ''); }
});

applySettings();
renderAccount();
renderCartCount();
route();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('/sw.js').catch(() => {});
